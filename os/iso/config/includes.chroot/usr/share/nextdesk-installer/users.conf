# NextDesk installer: local accounts. Everyday sign-in is with Nextcloud (greeter + nextdesk-pam);
# the installer only sets up root and a local admin account for emergencies (console, "Use a
# local account" on the login screen). Installed to /etc/calamares/modules/users.conf.
---
userGroup:       users
defaultGroups:
    - sudo
    - audio
    - video
    - plugdev
    - netdev
sudoersGroup:    sudo
autologinGroup:  autologin
doAutologin:     false
setRootPassword: true
doReusePassword: false
passwordRequirements:
    nonempty: true
    minLength: 8
    maxLength: -1
# No libpwquality: its dictionary (cracklib-runtime) isn't in the image, and these are local
# emergency accounts.
allowWeakPasswords: false
