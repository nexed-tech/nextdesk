# NextDesk OS installer (Calamares). Debian's sequence (calamares-settings-debian), with:
#  - no users step: the NextDesk wizard (before Calamares) asks for the computer name, root
#    password, optional admin and SSH; nextdesk-postinstall applies them (apply-answers)
#  - no displaymanager step: NextDesk's LightDM setup (greeter, session) is in the image already
#  - nextdesk-postinstall: the wizard's answers, firmware for this machine, live-session leftovers out
# Installed to /etc/calamares/settings.conf by the image's chroot hook.
---
modules-search: [ local, /usr/lib/calamares/modules ]
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - nextdesk-postinstall
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount
- show:
  - finished
branding: nextdesk
prompt-install: true
dont-chroot: false
