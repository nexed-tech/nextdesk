# NextDesk OS installer medium: the NextDesk GRUB theme (os/iso/branding/render.sh)
set color_normal=light-gray/black
set color_highlight=white/dark-gray

loadfont /boot/grub/live-theme/inter-regular-20.pf2
loadfont /boot/grub/live-theme/inter-semibold-20.pf2
loadfont /boot/grub/live-theme/inter-regular-14.pf2
set theme=/boot/grub/live-theme/theme.txt
