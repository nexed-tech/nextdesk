# NextDesk OS installer medium: GRUB (UEFI and BIOS). Replaces live-build's config.cfg.
set default=0
set timeout=5
set timeout_style=menu

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=1280x800,1024x768,800x600,auto
    set gfxpayload=keep
    # UEFI: only the firmware's graphics (GOP). GRUB's own bochs/cirrus drivers set a mode the
    # kernel then gets described wrongly: with nomodeset ("safe graphics") the screen was garbled
    if [ "${grub_platform}" = "efi" ]; then
        insmod efi_gop
        insmod efi_uga
    else
        insmod video_bochs
        insmod video_cirrus
    fi
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm
