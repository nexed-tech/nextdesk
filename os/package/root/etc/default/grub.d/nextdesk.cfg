# NextDesk OS (nextdesk-desktop): a quiet, graphical boot. Plymouth draws the splash and asks
# for the disk passphrase (encrypted installs) instead of a text prompt between boot messages.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 rd.systemd.show_status=auto systemd.show_status=auto"
# Keep the boot loader's graphics mode for the kernel, so the splash also works on BIOS machines
GRUB_GFXPAYLOAD_LINUX=keep

# No boot menu: straight into the splash. Hold Shift (BIOS) or press Esc (UEFI) during start to
# get it, e.g. for recovery.
GRUB_TIMEOUT=1
GRUB_TIMEOUT_STYLE=hidden
GRUB_DISTRIBUTOR="NextDesk"   # Debian adds "GNU/Linux": "NextDesk GNU/Linux"

# The menu, when shown, in the NextDesk look (as on the installer medium, without its fonts:
# the signed GRUB refuses font files under Secure Boot). GRUB can't read /usr on an encrypted
# root, so the theme is copied to /boot every time the menu is generated (update-grub sources
# this file).
if [ -d /usr/share/nextdesk/grub-theme ] && mkdir -p /boot/grub/themes/nextdesk 2>/dev/null; then
    cp -f /usr/share/nextdesk/grub-theme/* /boot/grub/themes/nextdesk/ 2>/dev/null &&
        GRUB_THEME=/boot/grub/themes/nextdesk/theme.txt
fi
