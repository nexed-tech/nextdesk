# Device policy for the NextDesk build/test VM (hostname build-<MAC>, hostname group "build").
# Same as nexed.yaml, plus the SSH key Claude Code uses on that VM: only this group accepts it.
# Keep it in step with nexed.yaml.

nextcloud:
  url: https://files.nexed.tech
  apps: [Calendar, Contacts, Files, Mail, Notes, Office, Photos, Tasks]

updates:
  automatic: true               # Debian, security, NextDesk and Chrome updates
  time: "03:00"                 # daily

packages:                       # the public servers; point these at local mirrors if wanted
  debian: http://deb.debian.org/debian
  security: http://security.debian.org/debian-security
  nextdesk: https://repo.nexed.tech   # a mirror here = test a release first, then refresh it

chrome:                         # Chrome policies on top of NextDesk's own (needs nextdesk-desktop 0.23.0+)
  ManagedBookmarks:             # a read-only "nexed.tech" folder on the bookmarks bar
    - toplevel_name: nexed.tech
    - name: Nextcloud
      url: https://files.nexed.tech
    - name: NextDesk on GitHub
      url: https://github.com/nexed-tech/nextdesk

install:                        # unattended installs (USB drive with nextdesk-install.json)
  encrypt: tpm                  # with the TPM chip; a computer without one stops at the disk step
  timezone: Asia/Manila

ssh:                            # public keys only, for administrators; re-applied every 15 minutes
  enabled: true
  authorized_keys:
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBE7C9tj61zhQRhRzHug3WDdMZq9fGI51ulrPYi39TjU
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFn+uvvNu+0aWB47MhIVTD1F5errmqUIMuzQ1WHzfd+h   # Claude Code on the build VM
