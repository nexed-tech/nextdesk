# Device policy for the nexed.tech NextDesk machines (files.nexed.tech).
# Published signed to https://repo.nexed.tech/policy/nexed.json; machines check it every 15 minutes.
# Keys: see policies/README.md.

nextcloud:
  url: https://files.nexed.tech
  apps: [Calendar, Contacts, Files, Mail, Notes, Office, Photos, Tasks]

updates:
  automatic: true               # Debian, security, NextDesk and Chrome updates
  time: "03:00"                 # daily

packages:                       # Debian's own servers; point these at a local mirror if wanted
  debian: http://deb.debian.org/debian
  security: http://security.debian.org/debian-security
